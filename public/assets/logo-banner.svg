<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <title>Gizmo — Companion Visual de Aulas em Tempo Real</title>
  <defs>
    <linearGradient id="ban-bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>
    <linearGradient id="ban-trail" x1="138" y1="224" x2="300" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#83C167"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="ban-voice" x1="56" y1="90" x2="124" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="ban-accent" x1="360" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58C4DD"/>
      <stop offset="50%" stop-color="#83C167"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#ban-bg)" stroke="#1E293B" stroke-width="3"/>

  <!-- Background math & blueprint grid -->
  <g stroke="#334155" stroke-opacity="0.22" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" stroke-dasharray="5 7"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke-dasharray="5 7"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke-dasharray="5 7"/>
    <line x1="340" y1="0" x2="340" y2="320" stroke-dasharray="5 7"/>
    <line x1="920" y1="0" x2="920" y2="320" stroke-dasharray="5 7"/>
  </g>

  <!-- Left Mascot Emblem -->
  <g transform="translate(24, 12) scale(0.58)">
    <g stroke="url(#ban-voice)" stroke-linecap="round">
      <line x1="82" y1="176" x2="82" y2="204" stroke-width="10"/>
      <line x1="108" y1="148" x2="108" y2="220" stroke-width="10"/>
      <line x1="134" y1="128" x2="134" y2="216" stroke-width="10"/>
      <line x1="160" y1="150" x2="160" y2="196" stroke-width="10"/>
    </g>
    <polygon points="274,352 332,262 382,352" fill="#58C4DD" fill-opacity="0.10" stroke="#58C4DD" stroke-opacity="0.40" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M 193.6 351 C 236 392, 276 266, 326 306 C 368 340, 392 232, 426 196"
          stroke="#38BDF8" stroke-width="13" stroke-linecap="round"/>
    <circle cx="326" cy="306" r="10" fill="#0B1020" stroke="#83C167" stroke-width="5"/>
    <path d="M 426 164 Q 426 196 458 196 Q 426 196 426 228 Q 426 196 394 196 Q 426 196 426 164 Z" fill="#FACC15"/>
    <g transform="rotate(22 240 236)">
      <path d="M 182 146 A 36 36 0 0 0 182 194" stroke="#58C4DD" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M 298 146 A 36 36 0 0 1 298 194" stroke="#58C4DD" stroke-width="6.5" stroke-linecap="round" opacity="0.6"/>
      <rect x="206" y="96" width="68" height="34" rx="16" fill="#FB7185"/>
      <rect x="198" y="118" width="84" height="178" rx="24" fill="#F8FAFC" stroke="#0F172A" stroke-width="4"/>
      <rect x="200" y="264" width="80" height="12" fill="#38BDF8"/>
      <path d="M 206 292 L 274 292 L 250 340 L 230 340 Z" fill="#CBD5E1" stroke="#0F172A" stroke-width="4"/>
      <path d="M 230 338 L 250 338 L 240 360 Z" fill="#67E8F9"/>
      <rect x="190" y="152" width="100" height="58" rx="20" fill="#0F172A" stroke="#334155" stroke-width="3"/>
      <circle cx="220" cy="179" r="9.5" fill="#58C4DD"/>
      <circle cx="223" cy="175.5" r="3.2" fill="#FFFFFF"/>
      <path d="M 248 183 Q 260 168 272 183" stroke="#58C4DD" stroke-width="6.5" stroke-linecap="round"/>
      <path d="M 233 196 Q 240 202 247 196" stroke="#83C167" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Wordmark & Tagline -->
  <text x="356" y="138" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="800" letter-spacing="-2" fill="#F8FAFC">
    Gizmo<tspan fill="#58C4DD">.</tspan>
  </text>
  <text x="360" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="500" fill="#94A3B8">
    Companion local de aulas que transforma sua voz em ilustrações vivas em tempo real
  </text>

  <!-- Feature Pills -->
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="14" font-weight="600">
    <rect x="360" y="216" width="176" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="448" y="239" text-anchor="middle" fill="#67E8F9">⚡ &lt;400ms Reflexo</text>

    <rect x="550" y="216" width="212" height="36" rx="18" fill="#1E293B" stroke="#83C167" stroke-opacity="0.5"/>
    <text x="656" y="239" text-anchor="middle" fill="#A3E635">🎙️ Parakeet + VAD Local</text>

    <rect x="776" y="216" width="194" height="36" rx="18" fill="#1E293B" stroke="#FBBF24" stroke-opacity="0.5"/>
    <text x="873" y="239" text-anchor="middle" fill="#FDE047">🎨 6 Canvases Vivos</text>

    <rect x="984" y="216" width="176" height="36" rx="18" fill="#1E293B" stroke="#FB7185" stroke-opacity="0.5"/>
    <text x="1072" y="239" text-anchor="middle" fill="#FDA4AF">🧠 OpenAI-Compat</text>
  </g>
</svg>
